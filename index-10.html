  <style>
/* =========================================================================
   Golf Trip Records — Jobs-era Apple homage
   Light ground, deep pine ink, single Myriad-descended sans (Source Sans 3).
   ========================================================================= */

/* ---- Tokens ---- */
:root {
  --bg:          #ffffff;
  --bg-alt:      #f3f6f3;
  --ink:         #0e3b29;   /* deep pine — headings, brand */
  --ink-soft:    #38504590; /* transparent for layering */
  --ink-body:    #385045;   /* secondary text */
  --muted:       #6f847a;   /* captions, labels */
  --line:        #e4eae5;   /* hairlines */
  --line-strong: #cfd9d1;
  --green:       #14432f;
  --green-brt:   #1e7a4d;   /* interactive accent, used sparingly */
  --green-wash:  #eaf1ec;
  --white:       #ffffff;
  --gold:        #b08a3e;   /* champion marker, quiet */

  --maxw: 1080px;
  --pad:  clamp(1.25rem, 5vw, 2.5rem);
  --sect: clamp(4.5rem, 10vw, 8.5rem);

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

/* ---- Reset ---- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

body {
  font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink-body);
  font-size: 17px;
  line-height: 1.55;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-variant-numeric: tabular-nums;
}

h1, h2, h3, h4 { color: var(--ink); font-weight: 600; line-height: 1.08; letter-spacing: -0.02em; }
a { color: inherit; text-decoration: none; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--pad); }
.wrap-wide { max-width: 1220px; margin: 0 auto; padding-inline: var(--pad); }

.eyebrow {
  font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--green-brt);
}

/* ---- Nav ---- */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.82);
  backdrop-filter: saturate(180%) blur(18px);
  -webkit-backdrop-filter: saturate(180%) blur(18px);
  border-bottom: 1px solid var(--line);
}
.nav-inner {
  max-width: var(--maxw); margin: 0 auto; padding-inline: var(--pad);
  height: 58px; display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 0.6rem; }
.brand svg { display: block; width: 26px; height: 26px; }
.brand .brand-name {
  font-weight: 600; color: var(--ink); font-size: 1.02rem; letter-spacing: -0.01em;
}
.nav-links { display: flex; gap: clamp(1.1rem, 4vw, 2.4rem); align-items: center; }
.nav-links a {
  font-size: 0.95rem; font-weight: 500; color: var(--ink-body);
  position: relative; padding: 4px 0; transition: color 0.25s var(--ease);
}
.nav-links a:hover { color: var(--ink); }
.nav-links a.active { color: var(--ink); }
.nav-links a.active::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: var(--green-brt); border-radius: 2px;
}

/* ---- Hero ---- */
.hero { position: relative; overflow: hidden; background: linear-gradient(180deg, #e9f2ec 0%, #f4f8f5 42%, #ffffff 100%); }
.hero-contours {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; opacity: 0.65;
}
.hero-inner {
  position: relative; z-index: 1;
  max-width: var(--maxw); margin: 0 auto; padding-inline: var(--pad);
  padding-block: clamp(2.25rem, 5vw, 4rem);
  text-align: center;
}
.hero h1 {
  font-size: clamp(2.4rem, 6.4vw, 4.6rem);
  letter-spacing: -0.035em; line-height: 0.98;
  color: var(--ink); margin-top: 0.8rem;
}
.hero .sub {
  font-size: clamp(1.02rem, 2vw, 1.32rem); color: var(--ink-body);
  max-width: 40ch; margin: 1.2rem auto 0; font-weight: 400;
}
/* Compact hero for interior pages (players, leaderboard) */
.hero--compact .hero-inner { padding-block: clamp(2rem, 4vw, 3.25rem); }
.hero--compact h1 { font-size: clamp(2.1rem, 5vw, 3.5rem); }
.hero .meta {
  margin-top: 1.6rem; display: flex; flex-wrap: wrap; gap: 0.5rem 1.2rem;
  justify-content: center; color: var(--muted); font-size: 0.95rem; font-weight: 500;
}
.hero .meta span { display: inline-flex; align-items: center; gap: 0.45rem; }
.hero .meta svg { width: 15px; height: 15px; opacity: 0.7; flex: none; }

/* countdown */
.countdown {
  margin-top: 2.6rem; display: flex; justify-content: center; gap: clamp(0.8rem, 3vw, 2rem);
}
.countdown .unit { text-align: center; min-width: 52px; }
.countdown .num {
  font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 600; color: var(--ink);
  letter-spacing: -0.03em; line-height: 1;
}
.countdown .lbl {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--muted); margin-top: 0.4rem;
}

/* ---- Sections ---- */
.section { padding-block: var(--sect); }
.section.alt { background: var(--bg-alt); }
.section.dark { background: var(--green); }
.section.dark .eyebrow { color: #7fc9a3; }
.section.dark h2 { color: #ffffff; }
.section.dark .statband .n { color: #ffffff; }
.section.dark .statband .l { color: #a9cdb8; }
.section.pt-tight { padding-top: clamp(1.5rem, 3vw, 2.5rem); }
.section-head { max-width: 60ch; margin-bottom: clamp(2.5rem, 5vw, 3.5rem); }
.section-head.center { margin-inline: auto; text-align: center; }
.section-head h2 { font-size: clamp(1.9rem, 4vw, 2.9rem); letter-spacing: -0.03em; margin-top: 0.7rem; }
.section-head p { margin-top: 0.9rem; color: var(--ink-body); font-size: 1.08rem; }

/* ---- Lineup (trip cards) ---- */
.lineup { display: grid; gap: clamp(1rem, 2.5vw, 1.6rem); grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.trip-card {
  position: relative; background: var(--white); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 2rem 1.9rem; overflow: hidden;
  transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease), border-color 0.4s var(--ease);
  display: flex; flex-direction: column; min-height: 320px;
}
.trip-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 18px 50px -24px rgba(14,59,41,0.35);
  border-color: var(--line-strong);
}
.trip-card .year {
  font-size: 3.4rem; font-weight: 600; color: var(--ink); letter-spacing: -0.04em; line-height: 1;
}
.trip-card .status {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600;
  padding: 0.3rem 0.6rem; border-radius: 100px; align-self: flex-start;
}
.trip-card .status.done { background: var(--green-wash); color: var(--green); }
.trip-card .status.next { background: var(--ink); color: var(--white); }
.trip-card .tc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
.trip-card h3 { font-size: 1.5rem; margin-top: 1.2rem; letter-spacing: -0.02em; }
.trip-card .courses {
  margin-top: 0.7rem; color: var(--muted); font-size: 0.95rem; line-height: 1.45;
}
.trip-card .champs { margin-top: auto; padding-top: 1.4rem; border-top: 1px solid var(--line); display: grid; gap: 0.55rem; }
.trip-card .champ-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; font-size: 0.95rem; }
.trip-card .champ-row .k { color: var(--muted); font-weight: 500; display: inline-flex; align-items: center; gap: 0.4rem; }
.trip-card .champ-row .v { color: var(--ink); font-weight: 600; }
.trip-card .champ-row .flag { width: 13px; height: 13px; color: var(--gold); }
.trip-card .champ-row .star { display: inline-flex; width: 13px; height: 13px; color: var(--green-brt); }
.trip-card .champ-row .star svg { width: 13px; height: 13px; }
.trip-card .champ-row .rec {
  color: var(--green-brt); font-weight: 700; font-size: 0.8rem;
  font-variant-numeric: tabular-nums; margin-left: 0.25rem;
}
.trip-card .when { margin-top: auto; padding-top: 1.4rem; border-top: 1px solid var(--line); color: var(--ink); font-weight: 600; font-size: 1.05rem; }
.trip-card .when small { display: block; color: var(--muted); font-weight: 500; font-size: 0.85rem; margin-top: 0.2rem; letter-spacing: 0.02em; }

/* ---- Stat band ---- */
.statband { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1.5rem; text-align: center; }
.statband .stat .n { font-size: clamp(2.4rem, 5vw, 3.4rem); font-weight: 600; color: var(--ink); letter-spacing: -0.04em; line-height: 1; }
.statband .stat .l { margin-top: 0.6rem; color: var(--muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 500; }

/* ---- Players grid ---- */
.players-grid { display: grid; gap: clamp(0.9rem, 2vw, 1.3rem); grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.player-card {
  background: var(--white); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 1.5rem 1.5rem 1.35rem; transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), border-color 0.35s var(--ease);
}
.player-card:hover { transform: translateY(-3px); box-shadow: 0 14px 40px -22px rgba(14,59,41,0.32); border-color: var(--line-strong); }
.player-card .pc-top { display: flex; align-items: center; gap: 0.85rem; }
.player-card .avatar {
  width: 42px; height: 42px; border-radius: 50%; flex: none;
  background: var(--green-wash); color: var(--green);
  display: grid; place-items: center; font-weight: 600; font-size: 0.95rem; letter-spacing: -0.01em;
}
.player-card .avatar.rookie { background: var(--bg-alt); color: var(--muted); }
.player-card h3 { font-size: 1.12rem; letter-spacing: -0.02em; }
.player-card .pc-sub { color: var(--muted); font-size: 0.82rem; font-weight: 500; margin-top: 0.1rem; }
.player-card .pc-stats { margin-top: 1.15rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem 1rem; }
.player-card .pc-stat .v { font-size: 1.15rem; font-weight: 600; color: var(--ink); letter-spacing: -0.02em; }
.player-card .pc-stat .k { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 0.15rem; font-weight: 500; }
.player-card .pc-foot { margin-top: 1.15rem; padding-top: 0.95rem; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.player-card .pc-foot .k { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
.player-card .pc-foot .rc { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---- Leaderboard table ---- */
.lb-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--white); }
table.lb { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 1040px; }
table.lb thead th {
  position: sticky; top: 0; background: var(--white);
  text-align: right; font-size: 0.72rem; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em; line-height: 1.25;
  padding: 0.9rem 0.7rem; border-bottom: 1px solid var(--line-strong);
  cursor: pointer; user-select: none; vertical-align: bottom; transition: color 0.2s var(--ease);
}
table.lb thead th:not(.player-col) { max-width: 5.5rem; }
table.lb thead th:hover { color: var(--ink); }
table.lb thead th.player-col, table.lb tbody td.player-col { text-align: left; }
table.lb thead th .arrow { opacity: 0; margin-left: 0.3rem; font-size: 0.7rem; }
table.lb thead th.sorted .arrow { opacity: 1; color: var(--green-brt); }
table.lb thead th.sorted { color: var(--ink); }
table.lb tbody td { text-align: right; padding: 0.8rem 0.7rem; border-bottom: 1px solid var(--line); font-size: 0.96rem; color: var(--ink-body); white-space: nowrap; }
table.lb tbody tr:last-child td { border-bottom: none; }
table.lb tbody tr { transition: background 0.15s var(--ease); }
table.lb tbody tr:hover { background: var(--bg-alt); }
table.lb td.player-col { font-weight: 600; color: var(--ink); }
table.lb .rank { color: var(--muted); font-weight: 600; width: 2.4rem; text-align: right; padding-right: 0.4rem; }
table.lb .medal { color: var(--gold); }
table.lb td .pos { display: inline-block; }
table.lb td.dim { color: var(--line-strong); }
.lb-note { margin-top: 1rem; color: var(--muted); font-size: 0.85rem; }

/* ---- Award icons ---- */
.awards { display: inline-flex; align-items: center; gap: 0.3rem; margin-left: 0.45rem; vertical-align: middle; }
.award { display: inline-flex; align-items: center; gap: 1px; }
.award svg { width: 15px; height: 15px; display: block; }
.award .cnt { font-size: 0.7rem; font-weight: 700; line-height: 1; }
.award.trophy { color: var(--gold); }
.award.mvp { color: var(--green-brt); }
table.lb .awards { margin-left: 0.35rem; }
.award-legend { display: inline-flex; flex-wrap: wrap; gap: 1.1rem; margin-top: 0.9rem; color: var(--muted); font-size: 0.82rem; }
.award-legend .item { display: inline-flex; align-items: center; gap: 0.4rem; }
.award-legend svg { width: 15px; height: 15px; }
.award-legend .trophy { color: var(--gold); }
.award-legend .mvp { color: var(--green-brt); }

/* ---- Trip cards as links ---- */
.trip-card--link { text-decoration: none; color: inherit; cursor: pointer; }
.trip-card .tc-cta {
  margin-top: 1.1rem; color: var(--green-brt); font-weight: 600; font-size: 0.92rem;
  opacity: 0; transform: translateX(-4px); transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
}
.trip-card--link:hover .tc-cta { opacity: 1; transform: none; }

/* ---- Trip detail page ---- */
.back-link {
  display: inline-flex; align-items: center; gap: 0.35rem; color: var(--green-brt);
  font-weight: 600; font-size: 0.92rem; margin-bottom: 1rem;
  transition: gap 0.25s var(--ease);
}
.back-link:hover { gap: 0.6rem; }
.trip-hero .hero-inner { text-align: center; }
.trip-hero .back-link { position: absolute; left: var(--pad); top: 1.1rem; margin: 0; }

.trip-summary {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 1rem; margin-bottom: 2rem;
}
.tsum-card { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-md); padding: 1.1rem 1.25rem; }
.tsum-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; }
.tsum-value { font-size: 1.3rem; font-weight: 600; color: var(--ink); letter-spacing: -0.02em; margin-top: 0.35rem; }
.tsum-sub { font-size: 0.82rem; color: var(--muted); margin-top: 0.3rem; font-variant-numeric: tabular-nums; }

/* segmented control */
.seg { display: inline-flex; background: var(--bg-alt); border: 1px solid var(--line); border-radius: 100px; padding: 3px; margin-bottom: 1.2rem; }
.seg-btn {
  border: 0; background: transparent; color: var(--ink-body); font: inherit; font-weight: 600;
  font-size: 0.9rem; padding: 0.4rem 1.3rem; border-radius: 100px; cursor: pointer;
  transition: background 0.2s var(--ease), color 0.2s var(--ease);
}
.seg-btn.on { background: var(--green); color: #fff; }

table.trip-lb thead th .rc-course {
  display: block; font-size: 0.6rem; font-weight: 500; color: var(--line-strong);
  text-transform: none; letter-spacing: 0; margin-top: 2px; white-space: nowrap;
}
table.trip-lb td.tot { font-weight: 600; color: var(--ink); }
table.trip-lb { min-width: 720px; }

/* ---- Footer ---- */
.footer { border-top: 1px solid var(--line); padding-block: 2.6rem; margin-top: var(--sect); }
.footer-inner { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--pad); display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.footer .brand svg { width: 22px; height: 22px; }
.footer p { color: var(--muted); font-size: 0.85rem; }

/* ---- Reveal animation ---- */
.reveal { opacity: 0; transform: translateY(18px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
.reveal.in { opacity: 1; transform: none; }

/* ---- Loading / empty ---- */
.loading { color: var(--muted); text-align: center; padding: 3rem 0; font-size: 0.95rem; }

/* ---- Responsive ---- */
@media (max-width: 720px) {
  body { font-size: 16px; }
  .brand .brand-name { display: none; }
  .trip-card { min-height: auto; }
  .player-card .pc-stats { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 460px) {
  .nav-links { gap: 1.05rem; }
  .nav-links a { font-size: 0.9rem; }
}

  </style>
</head>

  <script>
/* =========================================================================
   Core: data loading, score parsing, stat aggregation.
   Shared by every page. No dependencies.
   ========================================================================= */

const SITE = {
  // Leave blank until the crew has a name; the nav shows the mark alone.
  name: "",
  tagline: "Great courses. Real competition. Twelve months of bragging rights.",
  est: 2024,
};

/* ---- Data loading ---------------------------------------------------- */
// Resolve data paths relative to the site root so pages in any folder work.

async function loadData() {
  return {
    tournaments: (window.__DATA.tournaments || []).slice().sort((a, b) => (a.date || "").localeCompare(b.date || "")),
    upcoming: (window.__DATA.upcoming.trips || []).slice().sort((a, b) => (a.date || "").localeCompare(b.date || "")),
    playersMeta: window.__DATA.players.players || [],
    tripMvps: (window.__DATA.tripMvps && window.__DATA.tripMvps.byYear) || {},
  };
}

// A player's Ryder Cup W-L-T for a single tournament (win=1, tie=0.5, loss=0).
function ryderRecordForTrip(t, name) {
  if (!t || !t.ryderCup) return null;
  for (const team of t.ryderCup.teams) {
    for (const pl of (team.players || [])) {
      if (pl.player === name) {
        let w = 0, l = 0, tie = 0;
        for (const x of (pl.points_by_round || [])) {
          const v = parseFloat(x);
          if (Number.isNaN(v)) continue;
          if (v === 1) w++;
          else if (v === 0) l++;
          else tie++;
        }
        return `${w}-${l}-${tie}`;
      }
    }
  }
  return null;
}

// Ryder Cup team point totals + winner for a tournament.
function ryderSummary(t) {
  if (!t || !t.ryderCup) return null;
  const teams = t.ryderCup.teams.map((team) => {
    let pts = 0;
    for (const pl of (team.players || []))
      for (const x of (pl.points_by_round || [])) {
        const v = parseFloat(x);
        if (!Number.isNaN(v)) pts += v;
      }
    return { name: team.team, points: pts };
  });
  const sorted = [...teams].sort((a, b) => b.points - a.points);
  const tie = sorted.length > 1 && sorted[0].points === sorted[1].points;
  return { teams, winner: tie ? null : sorted[0].name, tie };
}

// Shorten a course name for compact column headers.
function shortCourse(c) {
  if (!c) return "";
  c = c.split("-").pop();
  return c.replace(/ Course$/i, "").replace(/ Resort$/i, "").trim();
}

// Build per-player rows for a single trip: round-by-round actual strokes
// (gross + net), totals, to-par, and Ryder record.
function tripDetail(t) {
  const rounds = t.roundsActual || [];
  const pars = rounds.map((r) => r.par);
  const parTotal = pars.reduce((a, b) => a + (b || 0), 0);
  const names = new Set();
  rounds.forEach((r) => Object.keys(r.scores || {}).forEach((n) => names.add(n)));
  const rows = [];
  for (const name of names) {
    const gross = rounds.map((r) => (r.scores && r.scores[name] != null ? r.scores[name] : null));
    const net = rounds.map((r) => (r.scoresNet && r.scoresNet[name] != null ? r.scoresNet[name] : null));
    const sum = (arr) => arr.filter((x) => x != null).reduce((a, b) => a + b, 0);
    const gTotal = gross.some((x) => x != null) ? sum(gross) : null;
    const nTotal = net.some((x) => x != null) ? sum(net) : null;
    rows.push({
      name, gross, net,
      grossTotal: gTotal, netTotal: nTotal,
      grossToPar: gTotal == null ? null : gTotal - parTotal,
      netToPar: nTotal == null ? null : nTotal - parTotal,
      ryder: ryderRecordForTrip(t, name),
    });
  }
  return { rows, rounds, pars, parTotal };
}

/* ---- Score parsing --------------------------------------------------- */
// "E" -> 0, "+12" -> 12, "-3" -> -3, "" -> null
function parseScore(s) {
  if (s === null || s === undefined) return null;
  s = String(s).trim();
  if (s === "") return null;
  if (s.toUpperCase() === "E") return 0;
  const n = Number(s.replace("+", ""));
  return Number.isNaN(n) ? null : n;
}

// Format a to-par number back to display: 0 -> "E", 12 -> "+12", -3 -> "-3"
function fmtToPar(n, decimals = 0) {
  if (n === null || n === undefined || Number.isNaN(n)) return "\u2014";
  const v = decimals ? Number(n.toFixed(decimals)) : Math.round(n);
  if (v === 0) return "E";
  return v > 0 ? `+${v}` : `${v}`;
}

function ordinal(n) {
  if (n === null || n === undefined) return "\u2014";
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function initials(name) {
  return name.split(/\s+/).map((p) => p[0]).slice(0, 2).join("").toUpperCase();
}

/* ---- Rankings within a single tournament ----------------------------- */
// Returns Map<player, {score, rank}> using standard competition ranking.
function rankBoard(entries) {
  const scored = entries
    .map((e) => ({ player: e.player, score: parseScore(e.total) }))
    .filter((e) => e.score !== null)
    .sort((a, b) => a.score - b.score);
  const out = new Map();
  let rank = 0, seen = 0, prev = null;
  for (const row of scored) {
    seen++;
    if (row.score !== prev) { rank = seen; prev = row.score; }
    out.set(row.player, { score: row.score, rank });
  }
  return out;
}

/* ---- Ryder Cup record parsing --------------------------------------- */
// "6-2-0" -> {w:6,l:2,t:0, pts:6, played:8}
function parseRyder(rec) {
  if (!rec) return { w: 0, l: 0, t: 0, pts: 0, played: 0, display: "0-0-0" };
  const [w, l, t] = rec.split("-").map((x) => parseInt(x, 10) || 0);
  return { w, l, t, pts: w + 0.5 * t, played: w + l + t, display: rec };
}

/* ---- All-time aggregation ------------------------------------------- */
// Builds one row per player across all played tournaments.
function buildAllTime(data) {
  const { tournaments, playersMeta } = data;
  const players = new Map();

  const ensure = (name) => {
    if (!players.has(name)) {
      players.set(name, {
        name,
        trips: 0,
        grossWins: 0, netWins: 0,                 // overall (whole-trip) wins
        grossRoundWins: 0, netRoundWins: 0,        // individual round wins
        bestGross: null, bestNet: null,            // best (lowest) trip total to par
        grossTotals: [], netTotals: [],
        grossRoundScores: [], netRoundScores: [],   // actual strokes per counted round
        lastHandicap: null,
        ryder: parseRyder(null),
        trophies: 0, mvp: 0,
      });
    }
    return players.get(name);
  };

  // Count individual round wins for one competition (gross or net).
  // For each round, the lowest score wins; ties each get a full win.
  const tallyRoundWins = (entries, field) => {
    if (!entries || !entries.length) return;
    const numRounds = Math.max(...entries.map((e) => (e.rounds || []).length), 0);
    for (let r = 0; r < numRounds; r++) {
      const scores = entries
        .map((e) => ({ player: e.player, s: parseScore((e.rounds || [])[r]) }))
        .filter((x) => x.s !== null);
      if (scores.length < 2) continue; // need a real field to "win" a round
      const min = Math.min(...scores.map((x) => x.s));
      for (const x of scores) if (x.s === min) ensure(x.player)[field]++;
    }
  };

  // Seed from meta (captures crew with 0 trips + authoritative Ryder records)
  for (const m of playersMeta) {
    const p = ensure(m.name);
    if (m.ryderCup) p.ryder = parseRyder(m.ryderCup);
    if (m.trophies) p.trophies = m.trophies;
    if (m.mvp) p.mvp = m.mvp;
  }

  for (const t of tournaments) {
    const grossRank = rankBoard(t.leaderboard.gross || []);
    const netRank = rankBoard(t.leaderboard.net || []);

    // Roster presence = appeared on the trip
    const roster = new Set((t.players || []).map((p) => p.name));
    for (const rp of (t.players || [])) {
      const p = ensure(rp.name);
      if (rp.handicap !== null && rp.handicap !== undefined) p.lastHandicap = rp.handicap;
    }
    for (const name of roster) ensure(name).trips++;

    for (const [name, info] of grossRank) {
      const p = ensure(name);
      p.grossTotals.push(info.score);
      p.bestGross = p.bestGross === null ? info.score : Math.min(p.bestGross, info.score);
      if (info.rank === 1) p.grossWins++;
    }
    for (const [name, info] of netRank) {
      const p = ensure(name);
      p.netTotals.push(info.score);
      p.bestNet = p.bestNet === null ? info.score : Math.min(p.bestNet, info.score);
      if (info.rank === 1) p.netWins++;
    }

    // Individual round wins (gross from gross board, net from net board)
    tallyRoundWins(t.leaderboard.gross, "grossRoundWins");
    tallyRoundWins(t.leaderboard.net, "netRoundWins");

    // Actual round scores (practice rounds already excluded by parser)
    for (const rd of (t.roundsActual || [])) {
      for (const [name, strokes] of Object.entries(rd.scores || {})) {
        ensure(name).grossRoundScores.push(strokes);
      }
      for (const [name, strokes] of Object.entries(rd.scoresNet || {})) {
        ensure(name).netRoundScores.push(strokes);
      }
    }
  }

  const mean = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
  const rows = [...players.values()].map((p) => ({
    ...p,
    bestGrossRound: p.grossRoundScores.length ? Math.min(...p.grossRoundScores) : null,
    bestNetRound: p.netRoundScores.length ? Math.min(...p.netRoundScores) : null,
    avgGrossRound: mean(p.grossRoundScores),
    avgNetRound: mean(p.netRoundScores),
    roundsPlayed: p.grossRoundScores.length,
    rcPts: p.ryder.pts,
  }));

  return rows;
}

/* ---- Champions per tournament --------------------------------------- */
function championsFor(t) {
  const g = rankBoard(t.leaderboard.gross || []);
  const n = rankBoard(t.leaderboard.net || []);
  const winner = (map) => [...map.entries()].find(([, v]) => v.rank === 1)?.[0] || null;
  return { gross: winner(g), net: winner(n) };
}

  if (navEl) navEl.outerHTML = renderNav(active);

/* ---- Scroll reveal --------------------------------------------------- */
function initReveal() {
  const els = document.querySelectorAll(".reveal");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!("IntersectionObserver" in window) || reduce) {
    els.forEach((el) => el.classList.add("in"));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { threshold: 0.08, rootMargin: "0px 0px -30px 0px" });
  els.forEach((el) => io.observe(el));
  // Fail-safe: reveal anything already in the viewport on load immediately,
  // and unconditionally reveal everything after a short delay so no content
  // can ever be left stuck at opacity:0 (e.g. if the observer misses it).
  requestAnimationFrame(() => {
    document.querySelectorAll(".reveal:not(.in)").forEach((el) => {
      if (el.getBoundingClientRect().top < window.innerHeight) el.classList.add("in");
    });
  });
  setTimeout(() => {
    document.querySelectorAll(".reveal:not(.in)").forEach((el) => el.classList.add("in"));
  }, 1400);
}

  const key = STATE.sortKey;
  const dir = STATE.sortDir === "asc" ? 1 : -1;

  const val = (r) => {
    if (key === "name") return r.name.toLowerCase();
    if (key === "rcPts") return r.rcPts;
    const v = r[key];
    return v;
  };

  STATE.rows.sort((a, b) => {
    let av = val(a), bv = val(b);
    // Nulls always sink to the bottom regardless of direction.
    const an = av === null || av === undefined;
    const bn = bv === null || bv === undefined;
    if (an && bn) return a.name.localeCompare(b.name);
    if (an) return 1;
    if (bn) return -1;
    if (typeof av === "string") return dir * av.localeCompare(bv);
    if (av === bv) {
      // stable tiebreak: lower avg net round, then name
      const at = a.avgNetRound ?? 999, bt = b.avgNetRound ?? 999;
      return (at - bt) || a.name.localeCompare(b.name);
    }
    return dir * (av - bv);
  });
}

function render() {
  sortRows();
  // Exactly one column is the active sort — prefer the exact key match
  // (e.g. RC Pts) over a sortBy alias (e.g. the Ryder Cup text column).
  const activeCol = COLUMNS.find((c) => c.key === STATE.sortKey)
                 || COLUMNS.find((c) => (c.sortBy || c.key) === STATE.sortKey);
  const thead = COLUMNS.map((c) => {
    const sk = c.sortBy || c.key;
    const sorted = c === activeCol;
    const arrow = sorted ? (STATE.sortDir === "asc" ? "\u2191" : "\u2193") : "";
    return `<th data-key="${sk}" class="${c.player ? "player-col " : ""}${sorted ? "sorted" : ""}">${c.label}<span class="arrow">${arrow}</span></th>`;
  }).join("");

  const body = STATE.rows.map((row, i) => {
    const rankCell = `<td class="rank">${i + 1}</td>`;
    const cells = COLUMNS.map((c) => cellValue(row, c)).join("");
    return `<tr>${rankCell.replace("<td", "<td").replace("</td>", "</td>")}${cells}</tr>`;
  }).join("");

  document.getElementById("lb-mount").innerHTML = `
    <div class="lb-scroll">
      <table class="lb">
        <thead><tr><th class="rank" style="cursor:default"></th>${thead}</tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
    <p class="lb-note">Tap any column to sort. Ryder Cup shown as wins\u2011losses\u2011ties (win = 1 pt, tie = \u00bd). Best and average are per-round actual scores (net and gross); practice rounds are excluded.</p>
    <div class="award-legend">
      <span class="item"><span class="trophy">${ICON_TROPHY}</span> Trip trophy</span>
      <span class="item"><span class="mvp">${ICON_MVP}</span> MVP</span>
    </div>
  `;

  document.querySelectorAll("table.lb thead th[data-key]").forEach((th) => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      const col = COLUMNS.find((c) => (c.sortBy || c.key) === key);
      if (STATE.sortKey === key) {
        STATE.sortDir = STATE.sortDir === "asc" ? "desc" : "asc";
      } else {
        STATE.sortKey = key;
        STATE.sortDir = col?.dir || "desc";
      }
      render();
    });
  });
}

async function main() {
  mountChrome("leaderboard");
  const app = document.getElementById("app");
  try {
    const data = await loadData();
    STATE.rows = buildAllTime(data).filter((p) => p.trips > 0); // board = those who've played

    app.innerHTML = `
      <section class="hero hero--compact"><div class="hero-inner">
        <p class="eyebrow">The Record Book</p>
        <h1>All-time leaderboard.</h1>
        <p class="sub">Overall wins, round wins, best and average round (net and gross), and the Ryder Cup ledger \u2014 every trip in one table.</p>
      </div></section>

      <section class="section pt-tight">
        <div class="wrap-wide"><div id="lb-mount"></div></div>
      </section>
    `;
    render();
  } catch (err) {
    app.innerHTML = `<section class="section"><div class="wrap"><p class="loading">Couldn\u2019t load leaderboard data. If previewing locally, run a local server (see README).</p></div></section>`;
    console.error(err);
  }
}

window.__pages["leaderboard"] = main;

})();
  </script>
  <script>
(function(){
window.__pages = window.__pages || {};
/* Trip detail: one trip's full results — round-by-round actual scores,
   totals, to-par, and Ryder Cup record. Gross/Net toggle. */

function getTripYear() {
  const q = new URLSearchParams(location.search);
  if (q.get("year")) return q.get("year");
  const raw = (location.hash || "").replace(/^#/, "");
  if (raw.startsWith("trip/")) return raw.slice(5);
  return null;
}

let TRIP_STATE = { view: "gross", t: null, detail: null };

function tripTable() {
  const { t, detail, view } = TRIP_STATE;
  const { rows, rounds } = detail;
  const isGross = view === "gross";

  const totKey = isGross ? "grossTotal" : "netTotal";
  const parKey = isGross ? "grossToPar" : "netToPar";
  const arrKey = isGross ? "gross" : "net";

  const sorted = [...rows].sort((a, b) => {
    const av = a[totKey] ?? Infinity, bv = b[totKey] ?? Infinity;
    return av - bv || a.name.localeCompare(b.name);
  });

  const roundHeads = rounds.map((r, i) =>
    `<th title="${r.course || ""} (par ${r.par})">R${i + 1}<span class="rc-course">${shortCourse(r.course)}</span></th>`
  ).join("");

  // standard competition ranking on the active total
  let rank = 0, seen = 0, prev = null;
  const body = sorted.map((row) => {
    seen++;
    const tv = row[totKey];
    if (tv !== prev) { rank = seen; prev = tv; }
    const cells = row[arrKey].map((v) => `<td>${v == null ? "\u2014" : v}</td>`).join("");
    const medal = rank === 1 ? " medal" : "";
    return `<tr>
      <td class="rank${medal}">${rank}</td>
      <td class="player-col">${row.name}${awardIcons(row)}</td>
      ${cells}
      <td class="tot">${tv == null ? "\u2014" : tv}</td>
      <td>${fmtToPar(row[parKey], 0)}</td>
      <td>${row.ryder || "\u2014"}</td>
    </tr>`;
  }).join("");

  return `
    <div class="seg">
      <button class="seg-btn ${isGross ? "on" : ""}" data-view="gross">Gross</button>
      <button class="seg-btn ${!isGross ? "on" : ""}" data-view="net">Net</button>
    </div>
    <div class="lb-scroll">
      <table class="lb trip-lb">
        <thead><tr>
          <th class="rank" style="cursor:default"></th>
          <th class="player-col">Player</th>
          ${roundHeads}
          <th>Total</th>
          <th>To Par</th>
          <th>Ryder</th>
        </tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
    <p class="lb-note">${isGross ? "Gross" : "Net"} scores are actual strokes per round. Ryder shows this trip\u2019s Ryder Cup record (W\u2011L\u2011T).</p>
  `;
}

function renderTripTable() {
  const mount = document.getElementById("trip-table");
  if (!mount) return;
  mount.innerHTML = tripTable();
  mount.querySelectorAll(".seg-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      TRIP_STATE.view = btn.dataset.view;
      renderTripTable();
    });
  });
}

async function main() {
  mountChrome(null);
  const app = document.getElementById("app");
  try {
    const data = await loadData();
    const year = getTripYear();
    const t = data.tournaments.find((x) => String(x.year) === String(year));
    const homeHref = window.__DATA ? "#home" : "index.html";

    if (!t) {
      app.innerHTML = `<section class="section"><div class="wrap">
        <a class="back-link" href="${homeHref}">\u2190 All trips</a>
        <p class="loading">That trip couldn\u2019t be found.</p>
      </div></section>`;
      return;
    }

    TRIP_STATE = { view: "gross", t, detail: tripDetail(t) };

    const champs = championsFor(t);
    const mvpName = data.tripMvps[String(t.year)];
    const mvp = mvpName ? { name: mvpName, record: ryderRecordForTrip(t, mvpName) } : null;
    const rc = ryderSummary(t);

    const sumCard = (label, value, sub) => `<div class="tsum-card">
      <div class="tsum-label">${label}</div>
      <div class="tsum-value">${value || "\u2014"}</div>
      ${sub ? `<div class="tsum-sub">${sub}</div>` : ""}
    </div>`;

    const rcValue = rc
      ? (rc.tie ? "Tied" : `${rc.winner}`)
      : null;
    const rcSub = rc ? rc.teams.map((tm) => `${tm.name} ${tm.points % 1 ? tm.points.toFixed(1) : tm.points}`).join("  \u00b7  ") : "";

    app.innerHTML = `
      <section class="hero hero--compact trip-hero">
        <div class="hero-inner">
          <a class="back-link" href="${homeHref}">\u2190 All trips</a>
          <p class="eyebrow">${t.dateDisplay || t.year}</p>
          <h1>${t.name}</h1>
          <div class="meta"><span>${(t.courses || []).map(shortCourse).join(" \u00b7 ")}</span></div>
        </div>
      </section>

      <section class="section pt-tight">
        <div class="wrap-wide">
          <div class="trip-summary">
            ${sumCard("Gross Champion", champs.gross)}
            ${sumCard("Net Champion", champs.net)}
            ${sumCard("MVP", mvp && mvp.name, mvp && mvp.record ? `Ryder ${mvp.record}` : "")}
            ${sumCard("Ryder Cup", rcValue, rcSub)}
          </div>
          <div id="trip-table"></div>
        </div>
      </section>
    `;
    renderTripTable();
  } catch (err) {
    app.innerHTML = `<section class="section"><div class="wrap"><p class="loading">Couldn\u2019t load this trip.</p></div></section>`;
    console.error(err);
  }
}

window.__pages["trip"] = main;

})();
  </script>
  <script>
    // Hash router: #players, #leaderboard, #trip/<year>, else home.
    function route() {
      const raw = (location.hash || '').replace(/^#/, '');
      let page = 'home';
      if (raw.startsWith('trip/')) page = 'trip';
      else if (raw === 'players' || raw === 'leaderboard') page = raw;
      document.getElementById('app').innerHTML = '<div class="loading">Loading…</div>';
      window.scrollTo(0, 0);
      (window.__pages[page] || window.__pages.home)();
    }
    window.addEventListener('hashchange', route);
    route();
  </script>
